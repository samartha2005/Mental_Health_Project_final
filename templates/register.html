<!DOCTYPE html>
<html>
<head>
    <title>Register | MindCare AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
        }

        .left {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
        }

        .left-content {
            max-width: 420px;
        }

        .left h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .left p {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
        }

        .card {
            background: white;
            padding: 40px;
            width: 380px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .subtext {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1cc88a;
            outline: none;
            box-shadow: 0 0 8px rgba(28,200,138,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #1cc88a, #4e73df);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        a {
            display: block;
            margin-top: 15px;
            color: #4e73df;
            text-decoration: none;
            font-size: 14px;
        }

        @media(max-width: 900px) {
            body {
                flex-direction: column;
            }

            .left {
                display: none;
            }

            .right {
                flex: none;
                height: 100vh;
            }
        }
    </style>
</head>

<body>

    <div class="left">
        <div class="left-content">
            <h1>Join MindCare AI</h1>
            <p>
                Start your journey towards better emotional awareness.
                Create your secure account and explore AI-powered
                mental wellness insights.
            </p>
        </div>
    </div>

    <div class="right">
        <div class="card">
            <div class="logo">✨</div>
            <h2>Create Account</h2>
            <div class="subtext">It only takes a minute</div>

            <form method="POST">
                <input type="text" name="username" placeholder="Choose Username" required>
                <input type="password" name="password" placeholder="Create Password" required>
                <button type="submit">Register</button>
            </form>

            <a href="/login">Already have an account? Login</a>
        </div>
    </div>

</body>
</html>
